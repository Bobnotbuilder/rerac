[workspace]
resolver = "2"
# Product crates (ship) under crates/; dev-only tools under tools/ (never shipped; product never depends on them).
members = ["crates/rc-formats", "crates/rc-engine", "crates/rc-game", "crates/rc-game2", "crates/rc-extract", "crates/rc-data", "crates/rc-video", "tools/trace", "tools/repo-checks", "tools/xtask"]

[workspace.package]
# The one ReRAC version (every crate: `version.workspace = true`). Release tags are `v<version>[-pre]`
# (docs/workflows/release.md); the manifest and `rerac --version-json` carry this version.
version = "0.3.4"
edition = "2021"
license = "ISC"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive", "min_const_generics", "extern_crate_alloc"] }

# Fast iteration: optimise dependencies (Bevy) fully, our crates lightly.
[profile.dev]
opt-level = 1
# macOS: bundle debug info into .dSYM so per-codegen-unit .o files don't pile up in target/
split-debuginfo = "packed"
[profile.dev.package."*"]
opt-level = 3
# No debug info for external crates (Bevy, wgpu, ...): macOS unpacked debug objects grew target/ to 132 GB.
debug = false

# iOS 27 scene lifecycle backport; see ios/SCENE_LIFECYCLE_REPAIR.md.
[patch.crates-io]
winit = { git = "https://github.com/molenick/winit", rev = "94d6a23c425023810a0879aa7a03abb2e4f1decc" }

# Keep the existing released dpi dependency; do not take the fork's path copy.
[patch."https://github.com/molenick/winit"]
dpi = { version = "=0.1.2" }
