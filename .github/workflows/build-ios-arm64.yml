name: ReRAC internal native compilation and regressions

on:
  workflow_dispatch:
  push:
    branches: ['ios/arm64-poc', 'ios/rc2-native', 'ios/rc2-upstream-integration']
    paths:
      - '.github/workflows/build-ios-arm64.yml'
      - 'ios/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: rerac-ios-poc-${{ github.ref }}
  # Preserve package, symbols and simulator evidence for a running integration.
  # Follow-up revisions queue and reuse its completed cache instead of cancelling validation.
  cancel-in-progress: false

jobs:
  headless-regressions:
    # Native desktop test harness only, not a game launch or Intel release gate.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: '3'
      RUST_TEST_THREADS: '3'
      RC_AUDIO: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: rust-target-cache
        with:
          path: target/
          key: rc2-headless-xcode27-rust1991-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Existing headless engine and UI regression tier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo xtask test-job engine ui --cargo-test 2>&1 | tee evidence/headless-regressions.log
          cargo test -p rc-game2 --lib --tests -- --nocapture 2>&1 | tee evidence/rc-game2-regressions.log
          python3 -m unittest discover -s tools/recovery/tests -v 2>&1 | tee evidence/rc2-overlay-analysis-tests.log
          cargo check -p rc-game2 --example rc2_deep_scan 2>&1 | tee evidence/rc2-deep-scan-compilation.log
          cargo test -p rc-video --lib --test rac2_original_frontend -- --nocapture 2>&1 | tee evidence/rc2-video-contract.log
          cargo xtask test-job formats extract data --cargo-test 2>&1 | tee evidence/extraction-regressions.log
      - name: RC2 read-only capture analyser synthetic tests and CLI compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p rc-trace --lib rc2_gs::tests 2>&1 | tee evidence/rc2-capture-tests.log
          cargo check -p rc-trace --bin rc-trace --examples 2>&1 | tee evidence/rc2-capture-cli-check.log
      - name: Experimental RC2 preview GPU texture depth and ordering fixture
        shell: bash
        run: |
          set -euo pipefail
          export RC2_SCENE_PREVIEW=synthetic-gpu-fixture
          export RC2_PREVIEW_GPU_FIXTURE=1
          export RC2_PREVIEW_HEADLESS=1
          export RC2_PREVIEW_CAPTURE="$PWD/evidence/rc2-preview-synthetic-gpu.png"
          cargo run -p rc-engine --features dev --bin rerac 2>&1 | tee evidence/rc2-preview-synthetic-gpu.log
          grep -q RC2_PREVIEW_GPU_PROBE_PASS evidence/rc2-preview-synthetic-gpu.log
          test -s evidence/rc2-preview-synthetic-gpu.png
      - uses: actions/cache/save@v4
        if: always() && steps.rust-target-cache.outputs.cache-hit != 'true'
        with:
          path: target/
          key: ${{ steps.rust-target-cache.outputs.cache-primary-key }}
      - name: Retain regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReRAC-headless-regression-evidence
          path: evidence/
          retention-days: 14
  rc2-preview-local-validation-binary:
    # Native diagnostic binary for running PRIVATE prepared assets on the
    # existing Intel macOS11 host. No desktop game release or media on CI.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: '3'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: rust-target-cache
        with:
          path: target/
          key: rc2-intel-preview-xcode27-rust1991-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Cross-compile native preview validation binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-apple-darwin
          mkdir -p evidence dist/RC2ScenePreview-macOS-x86_64
          cargo build --release --locked --target x86_64-apple-darwin -p rc-engine --bin rerac 2>&1 | tee evidence/rc2-preview-macos-build.log
          package=dist/RC2ScenePreview-macOS-x86_64
          cp target/x86_64-apple-darwin/release/rerac "$package/rerac"
          cp -R crates/rc-engine/assets "$package/assets"
          git rev-parse HEAD > "$package/source-commit.txt"
          file "$package/rerac" | tee evidence/rc2-preview-macos-file.txt
          otool -l "$package/rerac" > evidence/rc2-preview-macos-load-commands.txt
          otool -L "$package/rerac" > evidence/rc2-preview-macos-frameworks.txt
          test "$(lipo -archs "$package/rerac")" = x86_64
          shasum -a 256 "$package/rerac" > "$package/rerac.sha256"
      - uses: actions/cache/save@v4
        if: always() && steps.rust-target-cache.outputs.cache-hit != 'true'
        with:
          path: target/
          key: ${{ steps.rust-target-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: RC2-scene-preview-macOS-x86_64-validation
          path: dist/RC2ScenePreview-macOS-x86_64/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC2-scene-preview-macOS-build-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
  device:
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: never
      RERAC_SOURCE_COMMIT: ${{ github.sha }}
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS: '-C link-arg=-Wl,-no_adhoc_codesign'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record exact source, runner and SDK evidence
        run: |
          set -euo pipefail
          mkdir -p evidence dist
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor 8b2c9a92c48661bdc04fecd87c7e199d376d0b6a HEAD
          git rev-parse HEAD | tee evidence/source-commit.txt
          git status --porcelain | tee evidence/source-status.txt
          git diff 8b2c9a92c48661bdc04fecd87c7e199d376d0b6a --stat | tee evidence/source-changes.txt
          sw_vers | tee evidence/runner.txt
          xcodebuild -version | tee evidence/xcode.txt
          xcrun --sdk iphoneos --show-sdk-version | tee evidence/iphoneos-sdk.txt
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/rerac-ios-target" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        id: rust-target-cache
        with:
          path: ${{ runner.temp }}/rerac-ios-target/
          key: rc2-ios-xcode27-rust1991-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}

      - name: Install exact Rust device target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim
          rustup run "$RUSTUP_TOOLCHAIN" rustc -vV | tee evidence/rustc.txt
          rustup target list --installed --toolchain "$RUSTUP_TOOLCHAIN" | tee evidence/rust-targets.txt
          python3 -m unittest discover -s ios/tests -v 2>&1 | tee evidence/poc-contract-tests.log
          rustc --edition 2021 --test crates/rc-formats/src/game_id.rs -o "$RUNNER_TEMP/native-game-id-tests"
          "$RUNNER_TEMP/native-game-id-tests" --nocapture 2>&1 | tee evidence/native-game-id-tests.log
          rustc --edition 2021 --test crates/rc-engine/src/ios_display_math.rs -o "$RUNNER_TEMP/ios-display-math-tests"
          "$RUNNER_TEMP/ios-display-math-tests" --nocapture 2>&1 | tee evidence/ios-display-math-tests.log
          rustc --edition 2021 --test crates/rc-engine/src/render_policy.rs -o "$RUNNER_TEMP/render-policy-tests"
          "$RUNNER_TEMP/render-policy-tests" --nocapture 2>&1 | tee evidence/render-policy-tests.log
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 crates/rc-engine/src/ios_gamecontroller.m 2>&1 | tee evidence/gamecontroller-native-check.log
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 crates/rc-engine/src/ios_device.m 2>&1 | tee evidence/ios-device-native-check.log
          cargo metadata --locked --format-version 1 > evidence/cargo-metadata.json
          cargo tree --locked -i winit | tee evidence/winit-resolution.txt
          python3 -c 'import json; d=json.load(open("evidence/cargo-metadata.json")); assert next(p for p in d["packages"] if p["name"]=="rc-engine")["version"]=="0.3.4"'

      # iPhone-only delivery: no desktop release build or desktop gameplay gate.

      - name: Compile physical iPhone ARM64 game
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '1'
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" cargo build --release --locked --target aarch64-apple-ios -p rc-engine --bin rerac 2>&1 | tee evidence/ios-rust-build.log
          bin="$CARGO_TARGET_DIR/aarch64-apple-ios/release/rerac"
          file "$bin" | tee evidence/device-file.txt
          test "$(lipo -archs "$bin")" = arm64
          otool -l "$bin" > evidence/device-load-commands.txt
          otool -L "$bin" > evidence/device-frameworks.txt
          echo "RERAC_RUST_EXECUTABLE=$bin" >> "$GITHUB_ENV"

      - name: Build native unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project ios/ReRAC.xcodeproj -scheme ReRAC -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/rerac-ios-xcode" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build 2>&1 | tee evidence/xcodebuild.log
          app="$RUNNER_TEMP/rerac-ios-xcode/Build/Products/Release-iphoneos/ReRAC.app"
          plutil -lint "$app/Info.plist"
          test ! -d "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          echo "RERAC_APP=$app" >> "$GITHUB_ENV"

      - name: Collect matching device dSYM
        run: |
          set -euo pipefail
          python3 ios/collect_symbols.py --app "$RERAC_APP" --rust-binary "$RERAC_RUST_EXECUTABLE" --output symbols --evidence evidence

      - name: Verify device app and package unsigned IPA
        run: |
          set -euo pipefail
          python3 ios/verify_ipa.py --app "$RERAC_APP" --source . --version 0.3.4 --output dist --evidence evidence 2>&1 | tee evidence/package-verification.log
          unzip -t dist/ReRAC-iOS-arm64-unsigned.ipa | tee evidence/ipa-zip-test.txt
          shasum -a 256 dist/ReRAC-iOS-arm64-unsigned.ipa | tee evidence/ipa-sha256.txt

      - name: Upload unsigned IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          # Internal compilation artifact. Full Aranos acceptance is required
          # before presenting any package as a user-facing release candidate.
          name: ReRAC-INTERNAL-RC2-iOS-arm64-unsigned
          path: |
            dist/ReRAC-iOS-arm64-unsigned.ipa
            dist/ReRAC-iOS-arm64-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Retain UUID-matched device symbols
        uses: actions/upload-artifact@v4
        with:
          name: ReRAC-INTERNAL-RC2-iOS-arm64-symbols
          path: symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Launch actual import screen on iOS 27 simulator without game data
        run: |
          python3 ios/simulator_startup_smoke.py
          RERAC_SIM_AA_MODE=unbatched python3 ios/simulator_startup_smoke.py

      - name: Upload build evidence, also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReRAC-iOS-arm64-build-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.rust-target-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/rerac-ios-target/
          key: ${{ steps.rust-target-cache.outputs.cache-primary-key }}
